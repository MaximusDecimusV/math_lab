[project]
name = "neural-pde"
version = "0.0.0"
description = "Learned surrogates for nonlinear PDEs, checked against invariants"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "mathlab-shared",
]

[project.optional-dependencies]
# Pick one once the surrogate design is settled.
jax = ["jax>=0.4.30", "equinox>=0.11", "diffrax>=0.6", "optax>=0.2"]
torch = ["torch>=2.3", "torchdiffeq>=0.2"]

[tool.uv.sources]
mathlab-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_pde"]
