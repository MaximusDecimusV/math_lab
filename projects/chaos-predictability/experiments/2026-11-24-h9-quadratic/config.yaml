# H9: matching the structure of the equations beats adding neurons (notes/hypotheses.md). Lorenz only.
name: h9-quadratic
system: lorenz
base_config: experiments/2026-11-20-lorenz-horizon/config.yaml
eval_steps: 4000                                   # twice the usual rollout: some of these models outlast 2000 steps
train: {iters: 15000, batch: 2048, lr: 2.0e-3}     # Adam budget for the quad networks, as in H6 and H1
runs:
  # polynomial features + linear map on the one-step delta, least squares on 400k pairs, float64
  - {id: poly2, kind: poly, degree: 2, dtype: float64}
  - {id: poly3, kind: poly, degree: 3, dtype: float64}
  - {id: poly4, kind: poly, degree: 4, dtype: float64}
  - {id: poly5, kind: poly, degree: 5, dtype: float64}
  - {id: poly6, kind: poly, degree: 6, dtype: float64}
  # multiplicative-unit networks trained like the MLPs
  - {id: quad-w32-d1-s0, kind: quad, hidden: 32, depth: 1, seed: 0, dtype: float32}
  - {id: quad-w32-d1-s1, kind: quad, hidden: 32, depth: 1, seed: 1, dtype: float32}
  - {id: quad-w32-d1-s2, kind: quad, hidden: 32, depth: 1, seed: 2, dtype: float32}
  - {id: quad-w32-d2-s0, kind: quad, hidden: 32, depth: 2, seed: 0, dtype: float32}
  - {id: quad-w32-d2-s1, kind: quad, hidden: 32, depth: 2, seed: 1, dtype: float32}
  - {id: quad-w32-d2-s2, kind: quad, hidden: 32, depth: 2, seed: 2, dtype: float32}
  # quadratic vector field inside RK4 (30 parameters), fitted in float64, rolled out in float64 and float32
  - {id: vf-rk4x1-f64, kind: vf, substeps: 1, dtype: float64}
  - {id: vf-rk4x1-f32, kind: vf, substeps: 1, dtype: float32}
  - {id: vf-rk4x10-f64, kind: vf, substeps: 10, dtype: float64}
  - {id: vf-rk4x10-f32, kind: vf, substeps: 10, dtype: float32}
learned_lyapunov: {n_ics: 200, n_steps: 4000, renorm_every: 10, d0: 1.0e-6}
long_run: {n_ics: 50, n_steps: 20000, discard: 1000}
