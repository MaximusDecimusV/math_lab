[project]
name = "chaos-dyn"
version = "0.0.0"
description = "Chaotic ODEs, reference integrators, and how far learned predictors can see"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.11",
    "mathlab-shared",
    # 2.2.2 is the last PyTorch release with macOS x86_64 wheels (this machine is an Intel Mac).
    "torch==2.2.2",
]

[tool.uv.sources]
mathlab-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaos_dyn"]
