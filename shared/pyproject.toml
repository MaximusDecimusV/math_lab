[project]
name = "mathlab-shared"
version = "0.0.0"
description = "Utilities used by two or more math-lab projects"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathlab_shared"]
